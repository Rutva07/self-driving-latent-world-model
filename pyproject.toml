[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-driving-world-model"
version = "0.1.0"
description = "Ego-centric multi-agent latent world model for motion prediction"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24", "protobuf>=4.25", "PyYAML>=6", "tqdm>=4.66", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
